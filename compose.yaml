name: omnideck

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: omnideck/app:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      WEB_ROOT: /app/dist/web
      HOST: 0.0.0.0
      PORT: 3000
      AGENT_BIN_DIR: /app/agent-bin
      NODE_OPTIONS: --dns-result-order=ipv4first
    volumes:
      - app-data:/app/data
    networks: [monitoring]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=20GB
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/secrets/metrics_token:/run/secrets/metrics_token:ro
      - prometheus-data:/prometheus
    networks: [monitoring]
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.2.1
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: '%(protocol)s://%(domain)s/grafana/'
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_HEADERS: Name:X-WEBAUTH-NAME Role:X-WEBAUTH-ROLE
      GF_AUTH_PROXY_ENABLE_LOGIN_TOKEN: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [monitoring]
    depends_on: [prometheus]

  gateway:
    image: nginx:1.29.3-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:3200:3200
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [monitoring]
    depends_on:
      app:
        condition: service_healthy
      grafana:
        condition: service_started

networks:
  monitoring:
    driver: bridge

volumes:
  app-data:
  prometheus-data:
  grafana-data:
